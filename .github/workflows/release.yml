name: Release

# Triggered when you push a version tag:  git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

env:
  # Change this to your Docker Hub org/repo once you've created it
  DOCKER_IMAGE: ratheshprabakar/agentlens

jobs:
  # ── 1. Build & push multi-platform Docker image ────────────────────────────
  docker:
    name: Docker - build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU lets us build arm64 images on x64 runners
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:latest
          # Cache layers between runs (speeds up builds significantly)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Build self-contained CLI binaries ───────────────────────────────────
  #
  # Each binary bundles the Bun runtime - users need nothing installed.
  # Primary use: agentlens install / uninstall / status (hook management).
  # For the full server + UI, use Docker.
  #
  binaries:
    name: Binary - ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            target: bun-darwin-arm64
            artifact: agentlens-macos-arm64

          - runner: macos-13 # Intel Mac
            target: bun-darwin-x64
            artifact: agentlens-macos-x64

          - runner: ubuntu-latest # Linux x64 (most servers & WSL)
            target: bun-linux-x64
            artifact: agentlens-linux-x64

          - runner: ubuntu-latest # Linux ARM (Raspberry Pi, AWS Graviton)
            target: bun-linux-arm64
            artifact: agentlens-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install only runtime deps (pg, express, etc.) - no devDeps needed
      - run: pnpm install --prod --frozen-lockfile

      # --compile bundles everything (including Bun runtime) into one binary
      - name: Compile
        run: |
          bun build \
            --compile \
            --target=${{ matrix.target }} \
            --minify \
            src/cli.ts \
            --outfile ${{ matrix.artifact }}

      # UPX --best on linux-arm64 (esp. cross-built) can hang for hours - skip arm64
      - name: Compress with UPX (linux x64 only)
        if: matrix.target == 'bun-linux-x64'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y upx-ucl
          upx --lzma ${{ matrix.artifact }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── 3. Create GitHub Release with binary assets ────────────────────────────
  release:
    name: GitHub Release
    needs: [docker, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifact dirs
        run: find release-assets/ -type f -exec mv {} release-assets/ \; 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/agentlens-*
          body: |
            ## Install AgentLens ${{ github.ref_name }}

            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh | bash
            ```

            Docker image: `ratheshprabakar/agentlens:${{ github.ref_name }}` (also tagged `latest`)

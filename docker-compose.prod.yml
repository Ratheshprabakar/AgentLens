# ─────────────────────────────────────────────────────────────────────────────
# AgentLens - Production compose (external Postgres)
#
# Prefer single-image run when possible:
#   docker run -d --name agentlens -p 4040:4040 \
#     -v agentlens-data:/var/lib/postgresql/data \
#     -v ~/.claude:/host-claude \
#     -v ~/.claude/projects:/claude-projects:ro \
#     -v ~/.cursor/projects:/cursor-projects:ro \
#     ratheshprabakar/agentlens:latest
#
# This compose file keeps Postgres in a separate container (DATABASE_URL set,
# so the app image skips its embedded database).
#
#   curl -O https://raw.githubusercontent.com/Ratheshprabakar/AgentLens/main/docker-compose.prod.yml
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentlens
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: agentlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens -d agentlens"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── AgentLens App (pre-built from Docker Hub) ───────────────────────────────
  app:
    image: ratheshprabakar/agentlens:latest
    container_name: agentlens-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentlens:agentlens@postgres:5432/agentlens
      PORT: ${PORT:-4040}
      AGENTLENS_HOST_PORT: ${PORT:-4040}
      CLAUDE_PROJECTS_DIR: /claude-projects
      CURSOR_PROJECTS_DIR: /cursor-projects
    volumes:
      - ${CLAUDE_HOME:-~/.claude}:/host-claude
      - ${CLAUDE_PROJECTS_DIR:-~/.claude/projects}:/claude-projects:ro
      - ${CURSOR_PROJECTS_DIR:-~/.cursor/projects}:/cursor-projects:ro
    ports:
      - "${PORT:-4040}:4040"

volumes:
  pgdata:
    name: agentlens-pgdata
